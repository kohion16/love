<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Three Doors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="entrance-page">
  <main class="entrance">
    <p class="eyebrow">A LITTLE PLACE OUTSIDE OF TIME</p>
    <h1>Three doors.<br><span>Choose where to go.</span></h1>

    <nav class="doors" aria-label="Choose a door">
      <a class="door-link" href="past.html" aria-label="Enter the Past">
        <span class="door door-past">
          <span class="door-number">I</span>
          <span class="door-label">PAST</span>
          <span class="door-knob"></span>
        </span>
      </a>
      <a class="door-link" href="present.html" aria-label="Enter the Present">
        <span class="door door-present">
          <span class="door-number">II</span>
          <span class="door-label">PRESENT</span>
          <span class="door-knob"></span>
        </span>
      </a>
      <a class="door-link" href="future.html" aria-label="Enter the Future">
        <span class="door door-future">
          <span class="door-number">III</span>
          <span class="door-label">FUTURE</span>
          <span class="door-knob"></span>
        </span>
      </a>
    </nav>
    <p class="footnote">Take your time.</p>
  </main>
</body>
</html>
